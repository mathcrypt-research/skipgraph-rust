name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Without this, the action authenticates as the separately-installed Claude
          # GitHub App, whose pull-request permission is fixed and not governed by this
          # job's own `permissions:` block or by the repo's Actions approval setting.
          # Forcing the job's own token here makes both of those actually apply.
          github_token: ${{ github.token }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Pin the model explicitly: the action's built-in default model has been
          # retired and now returns a 404 not_found_error.
          model: "claude-opus-4-8"
          
          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
          
          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"
          
          # Allow Claude to submit a formal PR review verdict
          allowed_tools: "Bash(gh pr review:*)"

          # Add custom instructions for Claude to customize its behavior for your project
          custom_instructions: |
            If, and only if, you were asked to review a pull request, submit a formal GitHub
            review verdict yourself when you finish: run `gh pr review <number> --approve
            --body "..."` if you find no blocking issues, or `gh pr review <number>
            --request-changes --body "..."` if you do. State the verdict once, in that review
            body; do not duplicate it as a separate comment. This does not apply to a plain
            issue mention, or to a PR request that only asks for an implementation change
            rather than a review.
          
          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test

