[package]
name = "skipgraph"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"

[lints.rust]
# Several node types (BaseNode, BaseCore, RepairSchedule, Waiter) are staged ahead of the
# production wiring that will call them; allow at the package level instead of scattering
# per-item #[allow(dead_code)] across every not-yet-wired item. Remove once wired in.
dead_code = "allow"

[dependencies]
hex = "0.4.3"
anyhow = "1.0.86"
rand = "0.9.0-alpha.2"
fixedstr = "0.5.8"
tracing = "0.1"
tracing-subscriber = "0.3"
unimock = "0.6"
parking_lot = "0.12"
tokio = { version = "1.0", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }